name: Build and publish Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npx electron-builder --win nsis
      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fc27Mojprojekt ${{ github.ref_name }}
          body: |
            Aktualizacja Fc27Mojprojekt.
            - Dodano zakładkę Rynek i polecenia.
            - Porównywanie kart według budżetu, pozycji i preferencji.
            - Ceny trzeba potwierdzić w źródle FUT.GG; aplikacja nie zgaduje cen.
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          draft: false
          prerelease: false
